<!-- Edit this file to change the layout of the detail view print preview page -->


<div class="panel-heading"><h3 class="panel-title">
	<strong><%%DETAIL_VIEW_TITLE%%></strong>
	<div class="hidden-print pull-right">
		<div class="btn-group">
			<button type="button" id="print" onclick="window.print();" title="<%%TRANSLATION(Print)%%>" class="btn btn-primary"><i class="glyphicon glyphicon-print"></i> <%%TRANSLATION(Print)%%></button>
			<button type="submit" id="back" title="<%%TRANSLATION(Cancel Printing)%%>" class="btn btn-default"><i class="glyphicon glyphicon-remove-circle"></i> <%%TRANSLATION(Cancel Printing)%%></button>
		</div>
	</div>
	<div class="clearfix"></div>
</h3></div>

<div class="panel-body">
	<fieldset class="form-horizontal">
		<!-- Field: Employee details -->
		<div class="form-group employees_designation_table-employee_details" style="border-bottom: dotted 1px #DDD;">
			<label class="col-xs-3 control-label">Employee details</label>
			<div class="col-xs-9">
				<div class="form-control-static"><span id="employee_details<%%RND1%%>"><%%COMBOTEXT(employee_details)%%></span></div>
			</div>
		</div>
		<!-- Field: New designation -->
		<div class="form-group employees_designation_table-new_designation" style="border-bottom: dotted 1px #DDD;">
			<label class="col-xs-3 control-label">New designation</label>
			<div class="col-xs-9">
				<div class="form-control-static"><%%VALUE(new_designation)%%></div>
			</div>
		</div>
		<!-- Field: Date of appointment to new designation -->
		<div class="form-group employees_designation_table-date_of_appointment_to_new_designation" style="border-bottom: dotted 1px #DDD;">
			<label class="col-xs-3 control-label">Date of appointment to new designation</label>
			<div class="col-xs-9">
				<div class="form-control-static"><%%COMBOTEXT(date_of_appointment_to_new_designation)%%></div>
			</div>
		</div>
		<!-- Field: Previous designation (if available) -->
		<div class="form-group employees_designation_table-previous_designation" style="border-bottom: dotted 1px #DDD;">
			<label class="col-xs-3 control-label">Previous designation (if available)</label>
			<div class="col-xs-9">
				<div class="form-control-static"><%%VALUE(previous_designation)%%></div>
			</div>
		</div>
		<!-- Field: Date of resignation from previous resignation -->
		<div class="form-group employees_designation_table-date_of_resignation_from_previous_resignation" style="border-bottom: dotted 1px #DDD;">
			<label class="col-xs-3 control-label">Date of resignation from previous resignation</label>
			<div class="col-xs-9">
				<div class="form-control-static"><%%VALUE(date_of_resignation_from_previous_resignation)%%></div>
			</div>
		</div>
	</fieldset>
</div>
<script>
	$j(function() {
		// render read-only checkboxes in DVP
		$j('form input[type=checkbox]:not(.hidden):checked')
			.addClass('hidden')
			.after('<i class="glyphicon glyphicon-check"></i>');
		$j('form input[type=checkbox]:not(.hidden):not(:checked)')
			.addClass('hidden')
			.after('<i class="glyphicon glyphicon-unchecked"></i>')
	})
</script>
