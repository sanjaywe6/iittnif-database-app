<!-- Edit this file to change the layout of the detail view print preview page -->


<div class="panel-heading"><h3 class="panel-title">
	<strong><%%DETAIL_VIEW_TITLE%%></strong>
	<div class="hidden-print pull-right">
		<div class="btn-group">
			<button type="button" id="print" onclick="window.print();" title="<%%TRANSLATION(Print)%%>" class="btn btn-primary"><i class="glyphicon glyphicon-print"></i> <%%TRANSLATION(Print)%%></button>
			<button type="submit" id="back" title="<%%TRANSLATION(Cancel Printing)%%>" class="btn btn-default"><i class="glyphicon glyphicon-remove-circle"></i> <%%TRANSLATION(Cancel Printing)%%></button>
		</div>
	</div>
	<div class="clearfix"></div>
</h3></div>

<div class="panel-body">
	<fieldset class="form-horizontal">
		<!-- Field: Name of the department -->
		<div class="form-group operation_dronagiri_data_submission_app-name_of_the_department" style="border-bottom: dotted 1px #DDD;">
			<label class="col-xs-3 control-label">Name of the department</label>
			<div class="col-xs-9">
				<div class="form-control-static"><%%VALUE(name_of_the_department)%%></div>
			</div>
		</div>
		<!-- Field: Name of the officer -->
		<div class="form-group operation_dronagiri_data_submission_app-name_of_the_officer" style="border-bottom: dotted 1px #DDD;">
			<label class="col-xs-3 control-label">Name of the officer</label>
			<div class="col-xs-9">
				<div class="form-control-static"><%%VALUE(name_of_the_officer)%%></div>
			</div>
		</div>
		<!-- Field: Designation -->
		<div class="form-group operation_dronagiri_data_submission_app-designation" style="border-bottom: dotted 1px #DDD;">
			<label class="col-xs-3 control-label">Designation</label>
			<div class="col-xs-9">
				<div class="form-control-static"><%%VALUE(designation)%%></div>
			</div>
		</div>
		<!-- Field: Email address -->
		<div class="form-group operation_dronagiri_data_submission_app-email_address" style="border-bottom: dotted 1px #DDD;">
			<label class="col-xs-3 control-label">Email address</label>
			<div class="col-xs-9">
				<div class="form-control-static"><%%VALUE(email_address)%%></div>
			</div>
		</div>
		<!-- Field: Phone number -->
		<div class="form-group operation_dronagiri_data_submission_app-phone_number" style="border-bottom: dotted 1px #DDD;">
			<label class="col-xs-3 control-label">Phone number</label>
			<div class="col-xs-9">
				<div class="form-control-static"><%%VALUE(phone_number)%%></div>
			</div>
		</div>
	</fieldset>
</div>
<script>
	$j(function() {
		// render read-only checkboxes in DVP
		$j('form input[type=checkbox]:not(.hidden):checked')
			.addClass('hidden')
			.after('<i class="glyphicon glyphicon-check"></i>');
		$j('form input[type=checkbox]:not(.hidden):not(:checked)')
			.addClass('hidden')
			.after('<i class="glyphicon glyphicon-unchecked"></i>')
	})
</script>
<!-- child records -->
<div class="panel-body">
	<div id="operation_dronagiri_data_submission_app-children"></div>
</div>

<script>
	$j(function() {
		/* prevent loading child records in multiple DVP */
		if($j('[id=operation_dronagiri_data_submission_app-children]').length > 1) return;

		post(
			'parent-children.php', {
				ParentTable: 'operation_dronagiri_data_submission_app',
				SelectedID: '<%%VALUE(data_id)%%>',
				Operation: 'show-children-printable'
			},
			'operation_dronagiri_data_submission_app-children',
			'disable-element',
			'loading-element',
			apply_persisting_children
		);

		$j('form').on('click', '#children-tabs button[data-target]', function() {
			$j(this).toggleClass('active');
			persist_expanded_child($j(this).attr('id'));
		});
	})
</script>
