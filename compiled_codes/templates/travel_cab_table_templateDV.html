<!-- To change the layout of the detail view form, we recommend using JS code in hooks/travel_cab_table-dv.js rather than editing this file -->

<div id="detail-view"></div>
<div class="panel-heading"><h3 class="panel-title"><strong><%%DETAIL_VIEW_TITLE%%></strong></h3></div>

<div id="travel_cab_table_dv_container-loading" class="text-center text-info text-bold vspacer-lg"><i class="glyphicon glyphicon-refresh loop-rotate"></i> <%%TRANSLATION(Loading ...)%%></div>

<div class="panel-body hidden" id="travel_cab_table_dv_container">
	<!-- child links -->
	<div class="row vspacer-md">
		<div class="col-xs-12 children-links">
			<div class="clearfix"></div>
		</div>
	</div>
	<hr class="hidden-xs hidden-sm">

	<div class="row">
		<!-- form inputs -->
		<div class="col-md-8 col-lg-10" id="travel_cab_table_dv_form">
			<fieldset class="form-horizontal">

				<!-- Field: Travel details -->
				<div class="form-group travel_cab_table-travel_details">
					<hr class="hidden-md hidden-lg">
					<label class="control-label col-lg-3" data-parent_link="view_parent_modal">Travel details</label>
					<div class="col-lg-9">
						<div class="form-control-static">
							<span id="travel_details-readonly"><%%COMBOTEXT(travel_details)%%></span>
							<%%PLINK(travel_details)%%>
						</div>
					</div>
				</div>

				<!-- Field: Date -->
				<div class="form-group travel_cab_table-date">
					<hr class="hidden-md hidden-lg">
					<label class="control-label col-lg-3" for="date-dd">Date</label>
					<div class="col-lg-9">
						<%%COMBO(date)%%>
					</div>
				</div>

				<!-- Field: From -->
				<div class="form-group travel_cab_table-from">
					<hr class="hidden-md hidden-lg">
					<label class="control-label col-lg-3" for="from">From</label>
					<div class="col-lg-9">
						<input maxlength="255" type="text" class="form-control" name="from" id="from" value="<%%VALUE(from)%%>">
					</div>
				</div>

				<!-- Field: To -->
				<div class="form-group travel_cab_table-to">
					<hr class="hidden-md hidden-lg">
					<label class="control-label col-lg-3" for="to">To</label>
					<div class="col-lg-9">
						<input maxlength="255" type="text" class="form-control" name="to" id="to" value="<%%VALUE(to)%%>">
					</div>
				</div>

				<!-- Field: Vendor name -->
				<div class="form-group travel_cab_table-vendor_name">
					<hr class="hidden-md hidden-lg">
					<label class="control-label col-lg-3" for="vendor_name">Vendor name</label>
					<div class="col-lg-9">
						<input maxlength="255" type="text" class="form-control" name="vendor_name" id="vendor_name" value="<%%VALUE(vendor_name)%%>">
					</div>
				</div>

				<!-- Field: Vendor contact number -->
				<div class="form-group travel_cab_table-vendor_contact_number">
					<hr class="hidden-md hidden-lg">
					<label class="control-label col-lg-3" for="vendor_contact_number">Vendor contact number</label>
					<div class="col-lg-9">
						<input maxlength="255" type="text" class="form-control" name="vendor_contact_number" id="vendor_contact_number" value="<%%VALUE(vendor_contact_number)%%>">
					</div>
				</div>

				<!-- Field: Driver contact number -->
				<div class="form-group travel_cab_table-driver_contact_number">
					<hr class="hidden-md hidden-lg">
					<label class="control-label col-lg-3" for="driver_contact_number">Driver contact number</label>
					<div class="col-lg-9">
						<input maxlength="255" type="text" class="form-control" name="driver_contact_number" id="driver_contact_number" value="<%%VALUE(driver_contact_number)%%>">
					</div>
				</div>

				<!-- Field: Driver name -->
				<div class="form-group travel_cab_table-driver_name">
					<hr class="hidden-md hidden-lg">
					<label class="control-label col-lg-3" for="driver_name">Driver name</label>
					<div class="col-lg-9">
						<input maxlength="255" type="text" class="form-control" name="driver_name" id="driver_name" value="<%%VALUE(driver_name)%%>">
					</div>
				</div>

				<!-- Field: Payment status -->
				<div class="form-group travel_cab_table-payment_status">
					<hr class="hidden-md hidden-lg">
					<label class="control-label col-lg-3" for="payment_status">Payment status</label>
					<div class="col-lg-9">
						<%%COMBO(payment_status)%%>
					</div>
				</div>

				<!-- Field: Remarks -->
				<div class="form-group travel_cab_table-remarks">
					<hr class="hidden-md hidden-lg">
					<label class="control-label col-lg-3" for="remarks">Remarks</label>
					<div class="col-lg-9">
						<textarea class="form-control" name="remarks" id="remarks" rows=" 5"><%%VALUE(remarks)%%></textarea>
					</div>
				</div>

			</fieldset>
		</div>

		<!-- DV action buttons -->
		<hr class="hidden-md hidden-lg">
		<div class="col-md-4 col-lg-2" id="travel_cab_table_dv_action_buttons">
			<div class="btn-toolbar">
				<div class="btn-group-vertical btn-group-lg" style="width: 100%;">
					<%%UPDATE_BUTTON%%>
				</div><p></p>
				<div class="btn-group-vertical btn-group-lg" style="width: 100%;">
					<%%DESELECT_BUTTON%%>
					<%%DVPRINT_BUTTON%%>
					<%%DELETE_BUTTON%%>
				</div><p></p>
				<div class="btn-group-vertical btn-group-lg" style="width: 100%;">
					<%%INSERT_BUTTON%%>
				</div>
			</div>
		</div>
	</div>


</div><!-- /div class="panel-body" -->
	<script>
		$j(function() {
			var add_new_mode = (!$j('input[name=SelectedID]').val());
			var embedded_mode = ($j('input[name=Embedded]').val() == 1);

			/* auto-close embedded page? */
			var autoclose_mode = ($j('input[name=AutoClose]').val() == 1);
			var record_added_ok = (location.search.split('record-added-ok=').length == 2);
			var record_updated_ok = (location.search.split('record-updated-ok=').length == 2);
			if((record_added_ok || record_updated_ok) && embedded_mode && autoclose_mode) {
				setTimeout(AppGini.closeParentModal, 2000);
			}


			/* enable DV action buttons to float on scrolling down the form */
			enable_dvab_floating();

			$j('#travel_cab_table_dv_container-loading').addClass('hidden');
			$j('#travel_cab_table_dv_container').removeClass('hidden');
			if(!$j('.table_view').length || $j('[name=SelectedID]').val().length) AppGini.focusFormElement('travel_cab_table', 'date');

			$j('a[href="<%%BASE_UPLOAD_PATH%%>"]').click(function() { return false; });


			if(true /* !embedded_mode */) {
				$j('.add_new_parent').click(function() {
					var pt = $j(this).attr('id').replace(/_add_new$/, '');
					modal_window({
						url: pt + '_view.php?addNew_x=1&Embedded=1',
						close: function() {
							var field_id = $j('#' + pt + '_add_new').prevAll('input:hidden').eq(0).attr('id');
							$j('#' + field_id + '-container').select2('focus').select2('focus');

							/* if a new parent was added, select it */
							var new_id = localStorage.getItem(pt + '_last_added_id');
							if(new_id === null) return;

							localStorage.removeItem(pt + '_last_added_id');
							AppGini.lookupText({
								id: new_id,
								table: 'travel_cab_table',
								field: field_id,
								callback: function(data) {
									$j('#' + field_id + '-container').select2('data', data, true);
								}
							});
						},
						size: 'full',
						title: $j(this).attr('title')
					});
				});
			}

			AppGini.hideViewParentLinks();

			$j('form').on('click', '.view_parent', function() {
				var pt = $j(this).attr('id').replace(/_view_parent$/, '');
				if($j(this).prevAll('input:hidden').length) {
					var parent_id = $j(this).prevAll('input:hidden').eq(0).val();
				} else {
					var parent_id = $j(this).prevAll().children('input:hidden').eq(0).val();
				}

				/* handle radio lookups */
				if($j(this).prevAll('[type=radio]').length) {
					parent_id = $j(this).prevAll('[type=radio]').eq(0).val();
				}

				if(parent_id != '{empty_value}' && parent_id != undefined && parent_id != '') {
					var parent_link = $j(this).parents('.form-group').children('label').data('parent_link');
					switch(parent_link) {
						case 'view_parent_hidden':
							break;
						case 'view_parent_modal':
							modal_window({
								url: pt + '_view.php?Embedded=1&SelectedID=' + encodeURIComponent(parent_id),
								close: function() {
									var field_id = $j('#' + pt + '_view_parent').prevAll('input:hidden').eq(0).attr('id');
									$j('#' + field_id + '-container').select2('focus').select2('focus');

									// in case the parent record was updated, we should update auto-fills
									var updaterName = field_id + '_update_autofills';
									if(typeof(window[updaterName]) == 'function')
										window[updaterName]();
								},
								size: 'full',
								title: $j(this).attr('title')
							});
							break;
						case 'view_parent_same_window':
							window.location = pt + '_view.php?Embedded=' + (embedded_mode ? '1' : '') + '&SelectedID=' + encodeURIComponent(parent_id);
							break;
						case 'view_parent_new_window':
							window.open(pt + '_view.php?SelectedID=' + encodeURIComponent(parent_id));
							break;
					}

				}
			});


			/* load admin tools for admin user */
			if(!add_new_mode) {
				$j('body').append('<div id="admin-tools-appendix"></div>');
				$j('#admin-tools-appendix').load(
					'ajax_admin_tools.php?table=travel_cab_table&id=<%%URLVALUE(id)%%>',
					function(resp) {
						if(!resp.length) return;
						$j.ajax('ajax_admin_tools.php?action=get_admin_tools_js&table=travel_cab_table&id=<%%URLVALUE(id)%%>');
					}
				);
			}
		});
	</script>
