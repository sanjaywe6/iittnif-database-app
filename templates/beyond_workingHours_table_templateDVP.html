<!-- Edit this file to change the layout of the detail view print preview page -->


<div class="panel-heading"><h3 class="panel-title">
	<strong><%%DETAIL_VIEW_TITLE%%></strong>
	<div class="hidden-print pull-right">
		<div class="btn-group">
			<button type="button" id="print" onclick="window.print();" title="<%%TRANSLATION(Print)%%>" class="btn btn-primary"><i class="glyphicon glyphicon-print"></i> <%%TRANSLATION(Print)%%></button>
			<button type="submit" id="back" title="<%%TRANSLATION(Cancel Printing)%%>" class="btn btn-default"><i class="glyphicon glyphicon-remove-circle"></i> <%%TRANSLATION(Cancel Printing)%%></button>
		</div>
	</div>
	<div class="clearfix"></div>
</h3></div>

<div class="panel-body">
	<fieldset class="form-horizontal">
		<!-- Field: Reson for overtime -->
		<div class="form-group beyond_workingHours_table-reson_for_overtime" style="border-bottom: dotted 1px #DDD;">
			<label class="col-xs-3 control-label">Reson for overtime</label>
			<div class="col-xs-9">
				<div class="form-control-static"><%%VALUE(reson_for_overtime)%%></div>
			</div>
		</div>
		<!-- Field: Start Date & Time -->
		<div class="form-group beyond_workingHours_table-start_datetime" style="border-bottom: dotted 1px #DDD;">
			<label class="col-xs-3 control-label">Start Date & Time</label>
			<div class="col-xs-9">
				<div class="form-control-static"><%%VALUE(start_datetime)%%></div>
			</div>
		</div>
		<!-- Field: End Date & Time -->
		<div class="form-group beyond_workingHours_table-end_datetime" style="border-bottom: dotted 1px #DDD;">
			<label class="col-xs-3 control-label">End Date & Time</label>
			<div class="col-xs-9">
				<div class="form-control-static"><%%VALUE(end_datetime)%%></div>
			</div>
		</div>
		<!-- Field: Approval status -->
		<div class="form-group beyond_workingHours_table-approval_status" style="border-bottom: dotted 1px #DDD;">
			<label class="col-xs-3 control-label">Approval status</label>
			<div class="col-xs-9">
				<div class="form-control-static"><%%COMBOTEXT(approval_status)%%></div>
			</div>
		</div>
		<!-- Field: Approval remarks -->
		<div class="form-group beyond_workingHours_table-approval_remarks" style="border-bottom: dotted 1px #DDD;">
			<label class="col-xs-3 control-label">Approval remarks</label>
			<div class="col-xs-9">
				<div class="form-control-static"><%%VALUE(approval_remarks)%%></div>
			</div>
		</div>
	</fieldset>
</div>
<script>
	$j(function() {
		// render read-only checkboxes in DVP
		$j('form input[type=checkbox]:not(.hidden):checked')
			.addClass('hidden')
			.after('<i class="glyphicon glyphicon-check"></i>');
		$j('form input[type=checkbox]:not(.hidden):not(:checked)')
			.addClass('hidden')
			.after('<i class="glyphicon glyphicon-unchecked"></i>')
	})
</script>
