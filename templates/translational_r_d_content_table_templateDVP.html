<!-- Edit this file to change the layout of the detail view print preview page -->


<div class="panel-heading"><h3 class="panel-title">
	<strong><%%DETAIL_VIEW_TITLE%%></strong>
	<div class="hidden-print pull-right">
		<div class="btn-group">
			<button type="button" id="print" onclick="window.print();" title="<%%TRANSLATION(Print)%%>" class="btn btn-primary"><i class="glyphicon glyphicon-print"></i> <%%TRANSLATION(Print)%%></button>
			<button type="submit" id="back" title="<%%TRANSLATION(Cancel Printing)%%>" class="btn btn-default"><i class="glyphicon glyphicon-remove-circle"></i> <%%TRANSLATION(Cancel Printing)%%></button>
		</div>
	</div>
	<div class="clearfix"></div>
</h3></div>

<div class="panel-body">
	<fieldset class="form-horizontal">
		<!-- Field: Category -->
		<div class="form-group translational_r_d_content_table-category" style="border-bottom: dotted 1px #DDD;">
			<label class="col-xs-3 control-label">Category</label>
			<div class="col-xs-9">
				<div class="form-control-static"><%%COMBOTEXT(category)%%></div>
			</div>
		</div>
		<!-- Field: Sub Category -->
		<div class="form-group translational_r_d_content_table-sub_category" style="border-bottom: dotted 1px #DDD;">
			<label class="col-xs-3 control-label">Sub Category</label>
			<div class="col-xs-9">
				<div class="form-control-static"><%%COMBOTEXT(sub_category)%%></div>
			</div>
		</div>
		<!-- Field: Description -->
		<div class="form-group translational_r_d_content_table-description" style="border-bottom: dotted 1px #DDD;">
			<label class="col-xs-3 control-label">Description</label>
			<div class="col-xs-9">
				<div class="form-control-static"><%%VALUE(description)%%></div>
			</div>
		</div>
		<!-- Field: Upload Image First -->
		<div class="form-group translational_r_d_content_table-img1" style="border-bottom: dotted 1px #DDD;">
			<label class="col-xs-3 control-label">Upload Image First</label>
			<div class="col-xs-9">
				<div class="form-control-static">
<img src="<%%BASE_UPLOAD_PATH%%><%%VALUE(img1)%%>" class="img-responsive img-thumbnail">
</div>
			</div>
		</div>
		<!-- Field: Upload Image Second -->
		<div class="form-group translational_r_d_content_table-img2" style="border-bottom: dotted 1px #DDD;">
			<label class="col-xs-3 control-label">Upload Image Second</label>
			<div class="col-xs-9">
				<div class="form-control-static">
<img src="<%%BASE_UPLOAD_PATH%%><%%VALUE(img2)%%>" class="img-responsive img-thumbnail">
</div>
			</div>
		</div>
		<!-- Field: Approval status -->
		<div class="form-group translational_r_d_content_table-approval_status" style="border-bottom: dotted 1px #DDD;">
			<label class="col-xs-3 control-label">Approval status</label>
			<div class="col-xs-9">
				<div class="form-control-static"><%%COMBOTEXT(approval_status)%%></div>
			</div>
		</div>
		<!-- Field: Approved by -->
		<div class="form-group translational_r_d_content_table-approved_by" style="border-bottom: dotted 1px #DDD;">
			<label class="col-xs-3 control-label">Approved by</label>
			<div class="col-xs-9">
				<div class="form-control-static"><span id="approved_by<%%RND1%%>"><%%COMBOTEXT(approved_by)%%></span></div>
			</div>
		</div>
		<!-- Field: Website Update Status -->
		<div class="form-group translational_r_d_content_table-website_update_status" style="border-bottom: dotted 1px #DDD;">
			<label class="col-xs-3 control-label">Website Update Status</label>
			<div class="col-xs-9">
				<div class="form-control-static"><%%COMBOTEXT(website_update_status)%%></div>
			</div>
		</div>
	</fieldset>
</div>
<script>
	$j(function() {
		// render read-only checkboxes in DVP
		$j('form input[type=checkbox]:not(.hidden):checked')
			.addClass('hidden')
			.after('<i class="glyphicon glyphicon-check"></i>');
		$j('form input[type=checkbox]:not(.hidden):not(:checked)')
			.addClass('hidden')
			.after('<i class="glyphicon glyphicon-unchecked"></i>')
	})
</script>
