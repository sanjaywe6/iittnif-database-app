<!-- Edit this file to change the layout of the detail view print preview page -->


<div class="panel-heading"><h3 class="panel-title">
	<strong><%%DETAIL_VIEW_TITLE%%></strong>
	<div class="hidden-print pull-right">
		<div class="btn-group">
			<button type="button" id="print" onclick="window.print();" title="<%%TRANSLATION(Print)%%>" class="btn btn-primary"><i class="glyphicon glyphicon-print"></i> <%%TRANSLATION(Print)%%></button>
			<button type="submit" id="back" title="<%%TRANSLATION(Cancel Printing)%%>" class="btn btn-default"><i class="glyphicon glyphicon-remove-circle"></i> <%%TRANSLATION(Cancel Printing)%%></button>
		</div>
	</div>
	<div class="clearfix"></div>
</h3></div>

<div class="panel-body">
	<fieldset class="form-horizontal">
		<!-- Field: Travel details -->
		<div class="form-group travel_cab_table-travel_details" style="border-bottom: dotted 1px #DDD;">
			<label class="col-xs-3 control-label">Travel details</label>
			<div class="col-xs-9">
				<div class="form-control-static"><span id="travel_details-readonly<%%RND1%%>"><%%COMBOTEXT(travel_details)%%></span></div>
			</div>
		</div>
		<!-- Field: Date -->
		<div class="form-group travel_cab_table-date" style="border-bottom: dotted 1px #DDD;">
			<label class="col-xs-3 control-label">Date</label>
			<div class="col-xs-9">
				<div class="form-control-static"><%%COMBOTEXT(date)%%></div>
			</div>
		</div>
		<!-- Field: From -->
		<div class="form-group travel_cab_table-from" style="border-bottom: dotted 1px #DDD;">
			<label class="col-xs-3 control-label">From</label>
			<div class="col-xs-9">
				<div class="form-control-static"><%%VALUE(from)%%></div>
			</div>
		</div>
		<!-- Field: To -->
		<div class="form-group travel_cab_table-to" style="border-bottom: dotted 1px #DDD;">
			<label class="col-xs-3 control-label">To</label>
			<div class="col-xs-9">
				<div class="form-control-static"><%%VALUE(to)%%></div>
			</div>
		</div>
		<!-- Field: Vendor name -->
		<div class="form-group travel_cab_table-vendor_name" style="border-bottom: dotted 1px #DDD;">
			<label class="col-xs-3 control-label">Vendor name</label>
			<div class="col-xs-9">
				<div class="form-control-static"><%%VALUE(vendor_name)%%></div>
			</div>
		</div>
		<!-- Field: Vendor contact number -->
		<div class="form-group travel_cab_table-vendor_contact_number" style="border-bottom: dotted 1px #DDD;">
			<label class="col-xs-3 control-label">Vendor contact number</label>
			<div class="col-xs-9">
				<div class="form-control-static"><%%VALUE(vendor_contact_number)%%></div>
			</div>
		</div>
		<!-- Field: Driver contact number -->
		<div class="form-group travel_cab_table-driver_contact_number" style="border-bottom: dotted 1px #DDD;">
			<label class="col-xs-3 control-label">Driver contact number</label>
			<div class="col-xs-9">
				<div class="form-control-static"><%%VALUE(driver_contact_number)%%></div>
			</div>
		</div>
		<!-- Field: Driver name -->
		<div class="form-group travel_cab_table-driver_name" style="border-bottom: dotted 1px #DDD;">
			<label class="col-xs-3 control-label">Driver name</label>
			<div class="col-xs-9">
				<div class="form-control-static"><%%VALUE(driver_name)%%></div>
			</div>
		</div>
		<!-- Field: Payment status -->
		<div class="form-group travel_cab_table-payment_status" style="border-bottom: dotted 1px #DDD;">
			<label class="col-xs-3 control-label">Payment status</label>
			<div class="col-xs-9">
				<div class="form-control-static"><%%COMBOTEXT(payment_status)%%></div>
			</div>
		</div>
		<!-- Field: Remarks -->
		<div class="form-group travel_cab_table-remarks" style="border-bottom: dotted 1px #DDD;">
			<label class="col-xs-3 control-label">Remarks</label>
			<div class="col-xs-9">
				<div class="form-control-static"><%%VALUE(remarks)%%></div>
			</div>
		</div>
	</fieldset>
</div>
<script>
	$j(function() {
		// render read-only checkboxes in DVP
		$j('form input[type=checkbox]:not(.hidden):checked')
			.addClass('hidden')
			.after('<i class="glyphicon glyphicon-check"></i>');
		$j('form input[type=checkbox]:not(.hidden):not(:checked)')
			.addClass('hidden')
			.after('<i class="glyphicon glyphicon-unchecked"></i>')
	})
</script>
